<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>뷰어 시안 A · 방송 중계형</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="viewer-shared.css">
<style>
/* A. Broadcast: map left, tabbed panel right, timeline under both. Closest to the reference layout; baseline for comparison. */
body{height:100vh;display:grid;grid-template-rows:auto auto 1fr auto;overflow:hidden}
.top{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line)}
.top h1{font:900 1.5rem var(--f-display);text-transform:uppercase}
.top .meta{font:.78rem var(--f-mono);color:var(--mute)}
.top .vs{margin-left:auto;display:flex;gap:10px;align-items:center;font-weight:700}
.strip{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.strip>div{background:var(--bg2);padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:54px}
.strip .who{font:800 .95rem var(--f-display);min-width:72px}
.strip ul{display:flex;gap:6px;flex-wrap:wrap}
.strip .lab{font:.62rem var(--f-mono);color:var(--mute);margin-left:6px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0}
.stage{position:relative;min-height:0;border-right:1px solid var(--line)}
.stage .hud{position:absolute;left:12px;top:12px;display:flex;gap:8px}
.stage .hud span{background:#07080fcc;border:1px solid var(--line2);padding:4px 10px;border-radius:var(--r);font:.72rem var(--f-mono)}
.side{display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:11px 4px;font-size:.78rem;font-weight:700;color:var(--mute);border-bottom:2px solid transparent}
.tabs button[aria-selected=true]{color:var(--text);border-color:var(--accent)}
.pane{padding:14px;overflow:auto;display:none;gap:14px;align-content:start}.pane.on{display:grid}
.sg{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 10px;align-items:center;font-size:.85rem}
.sg .l{color:var(--mute);text-align:center;font-size:.72rem}
.sg b.a{color:var(--p1);text-align:right}.sg b.b{color:var(--p2)}
.sg b{font-family:var(--f-mono)}
.dock{border-top:1px solid var(--line);padding:10px 16px 14px;background:var(--bg2);display:grid;gap:10px}
.bt{display:grid;gap:8px}
.bt .it{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 10px;background:var(--panel);border:1px solid var(--line2);border-left:3px solid var(--ban);border-radius:var(--r);cursor:pointer;font-size:.85rem}
.bt .it b{font-family:var(--f-mono)}
@media (max-width:900px){body{height:auto;overflow:auto;display:block}.main{grid-template-columns:1fr}.stage{height:60vw;border:0}.strip{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <h1>Rorschach</h1><span class="meta">TvZ · 12:14 · 2026-10-08 · BPM 2.0</span>
  <span class="vs"><span class="p1c">P1</span> <span class="res-w">승</span> vs <span class="p2c">P2</span> <span class="res-l">패</span></span>
</header>
<section class="strip" id="strip" aria-label="밴픽"></section>
<section class="main">
  <div class="stage"><canvas id="map"></canvas><div class="hud"><span>근사 위치 · 약 10초 간격</span></div></div>
  <aside class="side">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-p="sum">요약</button><button role="tab" aria-selected="false" data-p="draft">밴픽</button>
      <button role="tab" aria-selected="false" data-p="units">유닛</button><button role="tab" aria-selected="false" data-p="eco">운영</button>
      <button role="tab" aria-selected="false" data-p="bat">교전</button>
    </div>
    <div class="pane on" id="p-sum">
      <p class="vw-k">지금 이 순간</p>
      <div class="sg"><b class="a" data-stat="1.sup">0</b><span class="l">보급</span><b class="b" data-stat="2.sup">0</b>
        <b class="a" data-stat="1.wk">0</b><span class="l">일꾼</span><b class="b" data-stat="2.wk">0</b>
        <b class="a" data-stat="1.army">0</b><span class="l">병력 가치</span><b class="b" data-stat="2.army">0</b>
        <b class="a" data-stat="1.inc">0</b><span class="l">분당 광물</span><b class="b" data-stat="2.inc">0</b></div>
      <p class="vw-k">결론</p><p>테란이 3분 25초 사이 두 번의 대규모 교전에서 병력 교환 우위를 잡고 승리. 픽한 파이어뱃/골리앗이 교전의 중심.</p>
    </div>
    <div class="pane" id="p-draft"><div id="draftPane" class="vw-list"></div></div>
    <div class="pane" id="p-units"><div class="sg"><b class="a" data-stat="1.killed">0</b><span class="l">처치 가치</span><b class="b" data-stat="2.killed">0</b><b class="a" data-stat="1.lost">0</b><span class="l">손실 가치</span><b class="b" data-stat="2.lost">0</b></div></div>
    <div class="pane" id="p-eco"><p class="vw-k">분당 광물 수입</p><div style="height:90px"><canvas id="chInc"></canvas></div><p class="vw-k">일꾼 수</p><div style="height:90px"><canvas id="chWk"></canvas></div><span class="vw-legend"><span><i style="background:var(--p1)"></i>P1</span><span><i style="background:var(--p2)"></i>P2</span></span></div>
    <div class="pane" id="p-bat"><div class="bt" id="bt"></div></div>
  </aside>
</section>
<footer class="dock"><div id="tr"></div><div id="tl"></div></footer>
<script src="viewer-data.js"></script><script src="viewer-core.js"></script>
<script>
const V = Viewer, D = V.D;
// draft strip: always visible above the map
document.getElementById("strip").innerHTML = D.draft.map((p, i) => { const h = V.draftHTML(i);
  return `<div><span class="who ${i ? "p2c" : "p1c"}">${V.raceImg(p.race)} P${i + 1}</span><span class="lab">픽</span><ul>${h.picks}</ul><span class="lab">밴당함</span><ul>${h.bans}</ul></div>`; }).join("");
document.getElementById("draftPane").innerHTML = D.draft.map((p, i) => { const h = V.draftHTML(i);
  return `<p class="vw-k ${i ? "p2c" : "p1c"}">P${i + 1} 고른 유닛</p><ul class="vw-list">${h.picks}</ul><p class="vw-k">받은 밴</p><ul class="vw-list row">${h.bans}</ul>`; }).join("");
document.getElementById("bt").innerHTML = V.battles.map((b) => `<div class="it" data-t="${b.t0}"><b>${b.id}</b><span>${V.fmt(b.t0)}–${V.fmt(b.t1)} · 손실 ${b.lost[1]} 대 ${b.lost[2]}</span><span class="${b.winner === 1 ? "p1c" : b.winner === 2 ? "p2c" : ""}">${b.winner ? "P" + b.winner + " 우세" : "비김"}</span></div>`).join("");
document.querySelectorAll("#bt .it").forEach((e) => (e.onclick = () => V.Clock.set(+e.dataset.t - 2)));
document.querySelectorAll(".tabs button").forEach((b) => (b.onclick = () => { document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-selected", x === b)); document.querySelectorAll(".pane").forEach((p) => p.classList.toggle("on", p.id === "p-" + b.dataset.p)); }));
V.mountMap(document.getElementById("map")); V.mountTransport(document.getElementById("tr")); V.mountTimeline(document.getElementById("tl")); V.bindStats();
V.drawChart(document.getElementById("chInc"), "inc"); V.drawChart(document.getElementById("chWk"), "wk");
</script>
</body>
</html>
